# Nightly data pipeline (02:30 IST): ingest -> embed -> dedup -> ghost scores, straight
# into Neon. Runs on GitHub's runners because Render's free instance sleeps and has
# 0.1 CPU (embedding there would take hours).
name: Nightly pipeline
on:
  schedule:
    - cron: "0 21 * * *"  # 21:00 UTC = 02:30 IST
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMBEDDING_CACHE_DIR: .cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: pip install .
      - run: alembic upgrade head
      - run: python -m app.ingest.run
      - run: python -m app.matching.run
