# 08:00 IST daily digest + keep-alive pings for Render's free instance (which sleeps
# after ~15 idle minutes, so its in-app scheduler can't be relied on).
name: Digest and keep-alive
on:
  schedule:
    - cron: "30 2 * * *"     # 02:30 UTC = 08:00 IST -> send digest
    - cron: "*/10 * * * *"   # keep the bot warm so replies don't wait for a cold start
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake / health check
        run: curl -fsS --retry 5 --retry-delay 20 --max-time 120 "${{ secrets.APP_URL }}/health"
      - name: Send daily digest
        if: github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsS --max-time 900 -X POST -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}" \
            "${{ secrets.APP_URL }}/admin/digest"
