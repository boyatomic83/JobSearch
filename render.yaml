# Render Blueprint: https://render.com/docs/blueprint-spec
# Secrets marked `sync: false` are entered once in the Render dashboard (never committed).
services:
  - type: web
    name: jobscout
    runtime: docker
    plan: free
    region: singapore  # closest Render region to India
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL  # Neon connection string
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_AGENT_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_REASONING_EFFORT
        value: low
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      # Free instances sleep when idle, so scheduled jobs run from GitHub Actions instead
      # (.github/workflows/). Keeping the in-app scheduler off avoids double digests.
      - key: SCHEDULER_ENABLED
        value: "false"
      # TELEGRAM_WEBHOOK_URL is not needed: the app uses RENDER_EXTERNAL_URL, which Render
      # sets automatically, and registers <url>/telegram/webhook on startup.
